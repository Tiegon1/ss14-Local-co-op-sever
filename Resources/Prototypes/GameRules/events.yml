- type: entityTable
  id: BasicCalmEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: AnomalySpawn
    - id: BluespaceArtifact
    - id: BluespaceLocker
    - id: BreakerFlip
    - id: BureaucraticError
    - id: ClericalError
    - id: CockroachMigration
    - id: GasLeak
    - id: GreytideVirus
    - id: IonStorm # its calm like 90% of the time smh
    - id: JobDistributionError
    - id: KudzuGrowth
    - id: MassHallucinations
    - id: MimicVendorRule
    - id: MouseMigration
    - id: PowerGridCheck
    - id: RandomSentience
    - id: SolarFlare
    - id: MediumMob
    - id: VentClog
    - id: Hardmob
    - id: Easymob
    - id: Hardestmob
#    - id: SyndyCat
    - id: SyndyMoth
#    - id: SyndyPenguin
    - id: MalignRiftSpawn # Funky
    - id: SneakySnake
    - id: SneakySyndy

- type: entityTable
  id: BasicAntagEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: ClosetSkeleton
    - id: DragonSpawn
    - id: KingRatMigration
    - id: NinjaSpawn
    - id: ParadoxCloneSpawn
    - id: RevenantSpawn
    - id: SleeperAgents
#    - id: ZombieOutbreak - funky
    - id: LoneOpsSpawn
    - id: BlobSpawn #Goobstation - Blob
    - id: FalseAlarm
    - id: DerelictCyborgSpawn
    - id: WizardSpawn
    - id: ColossusSpawn # Funky

- type: entity
  id: BaseStationEvent
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  10
      max:  20

- type: entity
  id: BaseStationEventShortDelay
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  10
      max:  20

- type: entity
  id: BaseStationEventLongDelay
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  40
      max:  60

- type: entity
  id: AnomalySpawn
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncementColor: "#18abf5"
    startAudio:
      path: /Audio/Announcements/announce.ogg
    weight: 16
    duration: 35
    chaos: # Goobstation
      Anomaly: 100
  - type: AnomalySpawnRule

- type: entity
  id: BluespaceArtifact
  parent: BaseStationEventShortDelay
  components:
  - type: GameRule
    delay:
      min:  30
      max:  30
  - type: StationEvent
    startAnnouncementColor: "#18abf5"
    startAudio:
      path: /Audio/Announcements/announce.ogg
    weight: 8
    duration: 35
    chaos: # Goobstation
      Anomaly: 40
  - type: BluespaceArtifactRule

- type: entity
  id: BluespaceLocker
  parent: BaseGameRule
  components:
  - type: StationEvent
    weight: 2
    reoccurrenceDelay: 20 #funkystation - stop happening so fucking often
    earliestStart: 1
    duration: 1
    chaos: # Goobstation
      Anomaly: 40
  - type: BluespaceLockerRule

- type: entity
  parent: BaseGameRule
  id: ClosetSkeleton
  components:
  - type: StationEvent
    weight: 5
    duration: 1
    minimumPlayers: 10
    reoccurrenceDelay: 30 # funkystation
  - type: RandomEntityStorageSpawnRule
    prototype: MobSkeletonCloset

# disabled until event is rewritten to be more interesting
- type: entity
  id: FalseAlarm
  parent: BaseGameRule
  components:
  - type: StationEvent
    weight: 15
    duration: 1
    chaos: # Goobstation
      Hostile: 15
      Friend: 15
      Combat: 15
      Death: 15
      Medical: 15
  - type: FalseAlarmRule

- type: entity
  id: GasLeak
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-gas-leak-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    endAnnouncement: station-event-gas-leak-end-announcement
    weight: 2
    chaos:
      Atmos: 100
      Medical: 50
  - type: GasLeakRule

- type: entity
  id: KudzuGrowth
  parent: BaseStationEventLongDelay
  components:
  - type: StationEvent
    earliestStart: 15
    minimumPlayers: 15
    weight: 7
    duration: 600 #if they can't deal with it in 10 minutes that's their problem
    chaos:
      Hostile: 20
      Friend: 20
      Medical: 100
  - type: KudzuGrowthRule

- type: entity
  id: VentClog
  parent: BaseStationEventLongDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-clog-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 15
    minimumPlayers: 1
    weight: 0.5
    duration: 60
    chaos: # Goobstation
      Mess: 200
  - type: VentClogRule


